[package]
name = "dbx-driver-african-banking"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native drivers for African interbank settlement systems: NIBSS (Nigeria), Pesalink (Kenya), GHIPSS (Ghana), RTC (South Africa), Zimswitch (Zimbabwe)"

[dependencies]
dbx-african-domain = { path = "../dbx-african-domain" }
dbx-drivers = { path = "../dbx-drivers", default-features = false }
dbx-types = { path = "../dbx-types", default-features = false }
dbx-sql = { path = "../dbx-sql", default-features = false }
dbx-platform = { path = "../dbx-platform" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"