[package]
name = "dbx-african-domain"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared types, patterns, and utilities for African database domains (mobile money, banking, healthcare, logistics)"

[dependencies]
dbx-types = { path = "../dbx-types", default-features = false }
dbx-platform = { path = "../dbx-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }